<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DeckStage · 版式原型库</title>
<meta name="description" content="DeckStage 版式原型库：12 个可复用的页面骨架（封面 / 目录 / 单观点 / 三并列 / 对照 / 过程链 / 阶梯 / 数据看板 / 分层架构 / 闭环 / 反例正例 / 收尾），抄结构，不抄内容。">
<style>
/*@STYLES*/
</style>
</head>
<body data-brand="DeckStage">
<div class="deck">
  <div class="stage">
    <div class="stage__bar"><i></i></div>
    <div class="slides">
<!--@SLIDES-->
    </div>
  </div>
</div>

<!-- ---------------- 放映外壳 ---------------- -->
<div class="chrome">
  <a class="chrome__home" href="/" title="返回 PPT 展示台 (H)" aria-label="返回展示台">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
    <span>展示台</span>
  </a>
  <div class="chrome__brand">
    <b>DeckStage</b>
    <span>版式原型库</span>
  </div>

  <nav class="chrome__rail" aria-label="Sections">
    <button data-rail-jump="基础"><em>01</em>基础</button>
    <button data-rail-jump="结构"><em>02</em>结构</button>
    <button data-rail-jump="表达"><em>03</em>表达</button>
  </nav>

  <div class="chrome__bottom">
    <div class="chrome__count"><b>01</b>/ 12</div>
    <div class="chrome__title"></div>
    <div class="chrome__progress" role="tablist" aria-label="页面进度"></div>
    <div class="chrome__tools">
      <button data-act="prev" title="上一屏 (←)" aria-label="上一屏">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button data-act="next" title="下一屏 (→)" aria-label="下一屏">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
      </button>
      <button data-act="overview" title="总览 (G)" aria-label="总览">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="4.6" height="4.6" rx="1"/><rect x="9.4" y="2" width="4.6" height="4.6" rx="1"/><rect x="2" y="9.4" width="4.6" height="4.6" rx="1"/><rect x="9.4" y="9.4" width="4.6" height="4.6" rx="1"/></svg>
      </button>
      <button data-act="notes" title="备注 (N)" aria-label="备注">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 3.2h11v8.2H7.4L4.6 13.6v-2.2H2.5z"/><path d="M5 6h6M5 8.4h4"/></svg>
      </button>
      <button class="chrome__ratio-btn" data-act="ratio" title="切换画幅：自动 / 16:9 / 4:3（R）" aria-label="切换画幅">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="1.6" y="3.4" width="12.8" height="9.2" rx="1.4"/></svg>
        <span class="chrome__ratio">16:9</span>
      </button>
      <button class="chrome__present" data-act="present" title="全屏放映 (F)" aria-label="全屏放映">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4"/><path d="M10 2h4v4"/><path d="M6 14H2v-4"/><path d="M10 14h4v-4"/></svg>
        <span>放映</span>
      </button>
      <button data-act="fullscreen" title="全屏 (F)" aria-label="全屏">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg>
      </button>
      <button data-act="export" title="导出 PPTX" aria-label="导出 PPTX">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0 3-3m-3 3L5 7"/><path d="M2.5 11v2.5h11V11"/></svg>
      </button>
    </div>
  </div>

  <div class="chrome__hint">← → 或点两侧翻页 · 空格逐步展开 · G 总览 · N 备注 · <b>R 画幅</b> · <b>F 全屏放映</b></div>
</div>

<!-- ---------------- 总览 ---------------- -->
<div class="overview">
  <div class="overview__head">
    <b>全部 12 屏</b>
    <span>点击任意一屏跳转 · Esc 关闭</span>
  </div>
  <div class="overview__grid"></div>
  <div class="overview__foot">DeckStage · 版式原型库 · 12 个页面骨架</div>
</div>

<!-- ---------------- 演讲者备注 ---------------- -->
<div class="notebar">
  <div class="notebar__head">
    <span class="notebar__label">演讲者备注</span>
    <button class="notebar__close" data-act="notes" aria-label="关闭备注" title="关闭备注 (N / Esc)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="notebar__body"></div>
</div>

<script src="src/js/deck.js"></script>
<script src="vendor/pptxgen.bundle.js"></script>
<script src="src/js/pptx-export.js"></script>
<!--@SCRIPTS-->
</body>
</html>
