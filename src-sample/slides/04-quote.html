<section class="slide" id="s04" data-title="设计哲学" data-rail="上手">
  <header class="head">
    <p class="kicker">03 / PHILOSOPHY</p>
    <h1 class="title">三条<em>设计取舍</em></h1>
  </header>

  <div class="body">
    <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
      <div class="card card--flat reveal" style="--d:80ms">
        <p class="kv__k">所见即所得</p>
        <p class="kv__v" style="margin-top:8px">导入的 deck 每屏 = 原稿整页图 + 补字层。<br>视觉与原稿零偏差，代价是改字要回源 PPTX 重导。</p>
      </div>
      <div class="card card--flat reveal" style="--d:200ms">
        <p class="kv__k">离线优先</p>
        <p class="kv__v" style="margin-top:8px">第三方运行时落盘在 vendor/，图片走本地相对路径。<br>单机版一个文件断网可用。</p>
      </div>
      <div class="card card--flat reveal" style="--d:320ms">
        <p class="kv__k">引擎与内容分离</p>
        <p class="kv__v" style="margin-top:8px">引擎与示例在仓库里，你的真实内容只属于你。<br>本地目录即站点，部署与开源互不干扰。</p>
      </div>
    </div>

    <div class="quote reveal" style="--d:460ms; margin-top: 34px; max-width: 900px;">
      幻灯片的本质是"把注意力摆到正确的地方"——引擎负责不让你分心。
      <p class="quote__by">DeckStage · 设计说明</p>
    </div>
  </div>

  <aside class="notes">三条取舍：像素保真优先于可编辑、离线可用优先于在线依赖、内容主权优先于生态锁定。</aside>
</section>
