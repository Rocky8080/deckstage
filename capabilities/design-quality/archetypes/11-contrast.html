<section class="slide" id="s11" data-title="反例正例 · 同一段要求" data-rail="表达" data-arch="contrast">
  <header class="head reveal" style="--d:40ms">
    <p class="kicker">10 / 反例与正例 · BEFORE / AFTER</p>
    <h1 class="title">同一段要求，<em>两种写法</em></h1>
  </header>

  <div class="body">
    <div class="ax-contrast">
      <div class="ax-contrast__panel ax-contrast__panel--bad reveal" style="--d:80ms">
        <p class="ax-contrast__k"><span>反例</span><span>不可验收</span></p>
        <p class="ax-contrast__q">「把这篇稿子改好一点，语言更专业。」</p>
        <p class="ax-contrast__note">没有范围、没有判据；改完只能凭感觉说「好像好点了」。</p>
      </div>
      <div class="ax-contrast__panel ax-contrast__panel--good reveal" style="--d:220ms">
        <p class="ax-contrast__k"><span>正例</span><span>可验收</span></p>
        <p class="ax-contrast__q">「保留原意和结构，只改三处：①与术语表不符的词；②没有口径的数字；③超过 40 字的句子。改完列出改动清单。」</p>
        <p class="ax-contrast__note">范围、判据、交付物都在一句话里；下一轮可以直接核对。</p>
