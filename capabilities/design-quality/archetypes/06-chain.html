<!-- 骨架 06 · 过程链｜适用：3–5 个连续环节、方法步骤｜容量：节点 ≤ 4，每节点说明 ≤ 2 行 -->
<section class="slide" id="s06" data-title="过程链 · 四个环节" data-rail="结构" data-arch="chain">
  <header class="head reveal" style="--d:40ms">
    <p class="kicker">05 / 过程 · CHAIN</p>
    <h1 class="title">一次改稿，<em>四个环节</em></h1>
  </header>

  <div class="body">
    <div class="ax-chain">
      <div class="ax-chain__node reveal" style="--d:80ms">
        <p class="ax-chain__no">01</p>
        <h3 class="ax-chain__h">通读</h3>
        <p class="ax-chain__p">不改字，只标出读不顺、要回头的位置。</p>
        <p class="ax-chain__out">产出：标记清单</p>
      </div>
      <div class="ax-chain__node reveal" style="--d:180ms">
        <p class="ax-chain__no">02</p>
        <h3 class="ax-chain__h">标问题</h3>
        <p class="ax-chain__p">每条写一句：哪里、为什么、按什么判据。</p>
        <p class="ax-chain__out">产出：问题清单</p>
      </div>
      <div class="ax-chain__node reveal" style="--d:280ms">
        <p class="ax-chain__no">03</p>
        <h3 class="ax-chain__h">只改一处</h3>
        <p class="ax-chain__p">一轮只动一类问题，改完立刻停。</p>
        <p class="ax-chain__out">产出：修改稿</p>
      </div>
      <div class="ax-chain__node reveal" style="--d:380ms">
        <p class="ax-chain__no">04</p>
        <h3 class="ax-chain__h">记结论</h3>
        <p class="ax-chain__p">这轮改了什么、下轮从哪开始，写两行。</p>
        <p class="ax-chain__out">产出：结论两行</p>
      </div>
    </div>

    <div class="ax-bottom reveal" style="--d:480ms">
      <p class="ax-note">四个环节不要合并；合并之后，修改理由会丢，下一轮只能凭印象。</p>
      <p class="bridge" style="margin-top:16px">环节不变，能力分四级——下一屏看阶梯。</p>
    </div>
  </div>

  <aside class="notes">过程链用细竖线分栏、箭头只加在节点之间。节点说明压到两行以内，屏幕才透气；四步以上改为两行或拆成两屏。</aside>
</section>
