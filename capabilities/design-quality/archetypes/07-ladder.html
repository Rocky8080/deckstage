<!-- 骨架 07 · 阶梯｜适用：成熟度、能力分级、逐级递进｜容量：4–6 级，每级一句判据 -->
<section class="slide" id="s07" data-title="阶梯 · 四级能力" data-rail="结构" data-arch="ladder">
  <header class="head reveal" style="--d:40ms">
    <p class="kicker">06 / 阶梯 · LADDER</p>
    <h1 class="title">从改一句到改全文，<em>四级能力</em></h1>
  </header>

  <div class="body">
    <div class="ax-ladder">
      <div class="ax-ladder__row reveal" style="--d:60ms">
        <span class="ax-ladder__no">01</span>
        <span class="ax-ladder__bar grow-x" style="--d:160ms"></span>
        <span class="ax-ladder__label"><b>L1 标点</b> · 只改错字和标点，不动句子</span>
      </div>
      <div class="ax-ladder__row reveal" style="--d:140ms">
        <span class="ax-ladder__no">02</span>
        <span class="ax-ladder__bar grow-x" style="--d:240ms"></span>
        <span class="ax-ladder__label"><b>L2 句子</b> · 拆长句、去重复，保住原意</span>
      </div>
      <div class="ax-ladder__row reveal" style="--d:220ms">
        <span class="ax-ladder__no">03</span>
        <span class="ax-ladder__bar grow-x" style="--d:320ms"></span>
        <span class="ax-ladder__label"><b>L3 段落</b> · 调整顺序和详略，段落结论对齐</span>
      </div>
      <div class="ax-ladder__row reveal" style="--d:300ms">
        <span class="ax-ladder__no">04</span>
        <span class="ax-ladder__bar grow-x" style="--d:400ms"></span>
        <span class="ax-ladder__label"><b>L4 全文</b> · 统一口径和结构，风格不跳</span>
      </div>
      <div class="ax-ladder__row reveal" style="--d:380ms">
        <span class="ax-ladder__no">05</span>
        <span class="ax-ladder__bar grow-x" style="--d:480ms"></span>
        <span class="ax-ladder__label"><b>L5 初稿</b> · 按模板生成可审的版本，人来定稿</span>
      </div>
    </div>

    <div class="ax-bottom reveal" style="--d:520ms">
      <p class="insight">多数团队停在 L2 级，不是不会改全文，是口径没有写下来。</p>
      <p class="bridge" style="margin-top:16px">写到哪一级，取决于这一版要交给谁。</p>
    </div>
  </div>

  <aside class="notes">阶梯用「条宽递增」表示层级，不堆卡片。每级只写一句判据，判据必须是可验收的动作；写不出来的级别直接删掉。</aside>
</section>
