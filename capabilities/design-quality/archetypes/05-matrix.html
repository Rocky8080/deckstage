<!-- 骨架 05 · 对照矩阵｜适用：A/B 方案、前后对比、两种做法比选｜容量：判据 ≤ 4 行，两列口径一致 -->
<section class="slide" id="s05" data-title="对照矩阵 · 两种改稿方式" data-rail="结构" data-arch="matrix">
  <header class="head reveal" style="--d:40ms">
    <p class="kicker">04 / 对照 · MATRIX</p>
    <h1 class="title">两种改稿方式，用<em>同一把尺子</em>比</h1>
  </header>

  <div class="body">
    <div class="ax-matrix">
      <div class="ax-matrix__head reveal" style="--d:80ms">
        <span>判据</span>
        <span>人工重写</span>
        <span>辅助校对</span>
      </div>
      <div class="ax-matrix__row reveal" style="--d:140ms">
        <span class="ax-matrix__k">定稿轮次</span>
        <span class="ax-matrix__v ax-matrix__v--no"><i class="ax-matrix__dot"></i>2.6 轮</span>
        <span class="ax-matrix__v ax-matrix__v--yes"><i class="ax-matrix__dot"></i>1.4 轮</span>
      </div>
      <div class="ax-matrix__row reveal" style="--d:200ms">
        <span class="ax-matrix__k">人均单篇耗时</span>
        <span class="ax-matrix__v ax-matrix__v--no"><i class="ax-matrix__dot"></i>18 分钟</span>
        <span class="ax-matrix__v ax-matrix__v--yes"><i class="ax-matrix__dot"></i>9 分钟</span>
      </div>
      <div class="ax-matrix__row reveal" style="--d:260ms">
        <span class="ax-matrix__k">口径一致性</span>
        <span class="ax-matrix__v ax-matrix__v--no"><i class="ax-matrix__dot"></i>靠记忆</span>
        <span class="ax-matrix__v ax-matrix__v--yes"><i class="ax-matrix__dot"></i>有清单</span>
      </div>
      <div class="ax-matrix__row reveal" style="--d:320ms">
        <span class="ax-matrix__k">可追溯</span>
        <span class="ax-matrix__v ax-matrix__v--no"><i class="ax-matrix__dot"></i>无</span>
        <span class="ax-matrix__v ax-matrix__v--yes"><i class="ax-matrix__dot"></i>每处可回原文</span>
      </div>
    </div>

    <p class="ax-note reveal" style="--d:380ms">口径（示例）：同一批 32 篇内部周报，2026-09 至 2026-11；轮次按「提交—退回」计，耗时为含等待的墙钟时间；基准为人工重写。</p>

    <div class="ax-bottom reveal" style="--d:440ms">
      <p class="insight">所以，省时间的关键不是生成得更快，而是少返工一次。</p>
      <p class="bridge" style="margin-top:16px">轮次是怎么降下来的？拆开一次改稿看。</p>
    </div>
  </div>

  <aside class="notes">对照页只放两列，判据在左、口径写在页脚。四行是上限：再多就换成一屏「证据图 + 结论」，不要做长表格。示例数字要替换成真实数据。</aside>
</section>
